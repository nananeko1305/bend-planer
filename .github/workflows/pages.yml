name: Deploy download page

# Redeploys the download page when only the page changed (release-apk.yml
# ignores these paths), so a new look does not cost a release and a push
# notification. The page is built for the newest release, and the live
# version.json is carried over untouched: it belongs to that release.
on:
  push:
    branches: [main]
    paths:
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  APK_NAME: bend-planer.apk

jobs:
  deploy:
    name: Deploy download page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      # The first merge has no release yet: release-apk.yml publishes the page
      # together with it, so there is nothing to redeploy here.
      - name: Find the newest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No release yet; the first release deploys the page."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site for the newest release
        if: steps.release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          PUBLISHED=$(gh release view --repo "$GITHUB_REPOSITORY" --json publishedAt -q .publishedAt)
          pip install --quiet qrcode
          VERSION="${TAG#v}" \
          DATE="$(TZ=Europe/Belgrade date -d "$PUBLISHED" +%d.%m.%Y.)" \
          DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$APK_NAME" \
            bash .github/pages/build.sh
          curl -fsS "${{ steps.pages.outputs.base_url }}/version.json" -o _site/version.json

      - uses: actions/upload-pages-artifact@v3
        if: steps.release.outputs.exists == 'true'
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.release.outputs.exists == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
